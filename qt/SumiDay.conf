# SumiDay colour scheme for qt5ct / qt6ct, part of cosmic-sumiday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> SumiDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#1c1b19, #f7f3eb, #f7f3eb, #d9d2c5, #e4ded2, #e4ded2, #1c1b19, #0e0e0d, #1c1b19, #f7f3eb, #ede8de, #e4ded2, #566658, #ede8de, #566658, #566658, #f7f3eb, #ede8de, #f7f3eb, #1c1b19, #64615e
disabled_colors=#979590, #f7f3eb, #f7f3eb, #d9d2c5, #e4ded2, #e4ded2, #979590, #54645a, #979590, #ede8de, #ede8de, #e4ded2, #d9d2c5, #54645a, #64615e, #64615e, #f7f3eb, #ede8de, #f7f3eb, #1c1b19, #d9d2c5
inactive_colors=#1c1b19, #f7f3eb, #f7f3eb, #d9d2c5, #e4ded2, #e4ded2, #1c1b19, #0e0e0d, #1c1b19, #f7f3eb, #ede8de, #e4ded2, #566658, #ede8de, #566658, #566658, #f7f3eb, #ede8de, #f7f3eb, #1c1b19, #64615e
